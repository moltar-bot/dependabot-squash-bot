name: "Dependabot Squash Bot"
description: "Auto-squash-merge Dependabot PRs when checks pass"
author: "moltar-bot"
inputs:
  github_token:
    description: "GitHub token with repo scope"
    required: true
  allow_update_types:
    description: "Comma-separated list of allowed update types: major, minor, patch. Default: all"
    required: false
    default: ""
  require_label:
    description: "Comma-separated list of labels required on the PR"
    required: false
    default: ""
  deny_labels:
    description: "Comma-separated list of labels that will block merging"
    required: false
    default: ""
  min_approvals:
    description: "Minimum number of approved reviews required"
    required: false
    default: ""
runs:
  using: "node20"
  main: "dist/index.js"
